# Local dev: EC2 Postgres through the SSH tunnel on localhost:5433.
# DB_PASSWORD comes from backend/.env (gitignored); no default, so a missing password fails at startup.
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true

# Import the curated POI seed on startup (idempotent; development only).
app.seed.enabled=true

# Weather fixture for local demos until the NEA 2-hour feed is wired.
app.weather.fixture-enabled=true
app.weather.fixture-rainy=true

# Keep NeaWeatherSource out of the dev profile: the fixture must stay authoritative.
app.weather.source=none

# Full offline POI index (optional). Generate it with scripts/build-sg-pois.sh,
# then set app.index.enabled=true to import it alongside the 49 curated places.
app.index.enabled=false
app.index.path=../data/osm/sg-pois.geojson
