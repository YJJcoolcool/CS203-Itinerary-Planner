spring.application.name=itinerary-planner

# Local Clerk configuration
spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Datasource lives in application-dev/prod.properties; run with one of those profiles.
# Flyway owns the schema (db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Common migrations plus a vendor-specific folder (e.g. db/migration-postgresql).
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/migration-postgresql}

# Batch writes. The dev database sits behind an SSH tunnel at ~350 ms per round
# trip, so per-row INSERTs make a 10k-row POI import take about an hour.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# OpenAI (optional; no key is required to boot, AI features fall back when unset)
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
# Spring AI 2.x uses the official OpenAI SDK, which expects /v1 in the base URL.
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=800

# OSM integration
# The offline POI seed is off by default; application-dev.properties enables app.seed.enabled.
app.osm.user-agent=${APP_OSM_USER_AGENT:ItineraryPlanner/1.0 (+https://github.com/CS203-Itinerary-Planner)}
app.osm.nominatim.base-url=${APP_OSM_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.osm.overpass.base-url=${APP_OSM_OVERPASS_BASE_URL:https://overpass-api.de/api/interpreter}
app.osm.connect-timeout=${APP_OSM_CONNECT_TIMEOUT:5s}
app.osm.read-timeout=${APP_OSM_READ_TIMEOUT:30s}

# Weather: Singapore-only, NEA-backed.
# app.weather.source=nea selects NeaWeatherSource (the default here).
# application-dev.properties sets it to `none` so FixtureWeatherSource stays in charge.
# NoRainWeatherSource remains the fallback whenever the NEA source is not selected.
app.weather.source=${APP_WEATHER_SOURCE:nea}

# Semantic ranking (lightweight RAG): no vector database, just precomputed
# embeddings and a cosine scan over the bbox subset. Disabled when no key or
# outside production; discovery then falls back to the SQL arm.
app.rag.enabled=${APP_RAG_ENABLED:true}
app.rag.model=${APP_RAG_MODEL:text-embedding-3-small}
# The model Spring AI actually calls; app.rag.model is only the stored label.
spring.ai.openai.embedding.options.model=${APP_RAG_MODEL:text-embedding-3-small}
# 512 dims (2048 B) matches app.rag.model's space and stays under the 8192-byte
# place_embedding.vector column cap.
spring.ai.openai.embedding.dimensions=${APP_RAG_DIMENSIONS:512}
app.rag.embed-on-startup=${APP_RAG_EMBED_ON_STARTUP:false}

# Clerk user ids (comma-separated) promoted to ADMIN on login. Empty = nobody.
app.admin.clerk-user-ids=${ADMIN_CLERK_USER_IDS:}

# Proactive polling (M4b). Off by default; enable with APP_POLLING_ENABLED=true.
app.polling.enabled=${APP_POLLING_ENABLED:false}
app.polling.activity-delay-ms=${APP_POLLING_ACTIVITY_DELAY_MS:600000}
app.polling.initial-delay-ms=${APP_POLLING_INITIAL_DELAY_MS:60000}

# Scheduling pool for the poller (and any future scheduled jobs).
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:2}