name: Telegram_Notifier

on:
  push:
  pull_request:
    types: [opened, closed]

jobs:
  notifyTelegram:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Telegram Message
        id: prepare_msg
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}

          # Push information
          BRANCH: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          AFTER: ${{ github.event.after }}

          # Pull request information
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}

        run: |
          if [ "$EVENT_NAME" = "push" ]; then

            # Get commit messages
            MSG_BODY=$(echo "$COMMITS_JSON" | jq -r '.[] | "• " + .message' 2>/dev/null)

            if [ -z "$MSG_BODY" ]; then
              MSG_BODY="No commit messages found"
            fi

            # Build push notification
            FULL_MSG="$ACTOR pushed to $REPO (<code>$BRANCH</code>):"$'\n\n'"$MSG_BODY"$'\n\n'
            FULL_MSG="${FULL_MSG}<a href=\"https://github.com/$REPO/commit/$AFTER\">View Changes</a>"

          elif [ "$EVENT_NAME" = "pull_request" ]; then

            if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then

              # Pull request was merged
              FULL_MSG="$ACTOR merged Pull Request into <code>$PR_BASE</code>: <b>$PR_TITLE</b>"$'\n\n'
              FULL_MSG="${FULL_MSG}<a href=\"$PR_URL\">View Pull Request</a>"

            elif [ "$ACTION" = "opened" ]; then

              # New pull request
              FULL_MSG="$ACTOR created a new Pull Request: <b>$PR_TITLE</b>"$'\n\n'
              FULL_MSG="${FULL_MSG}<a href=\"$PR_URL\">View Pull Request</a>"

            else
              # Closed without merging -- don't notify
              exit 0
            fi

          else
            exit 0
          fi

          # Write multiline output
          {
            echo "commit_msg<<EOF"
            echo "$FULL_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Notification to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: ${{ steps.prepare_msg.outputs.commit_msg }}