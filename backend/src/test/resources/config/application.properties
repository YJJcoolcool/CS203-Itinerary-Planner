# Tests run on in-memory H2 with Hibernate-built schema, so they need no Postgres.
# Lives in config/ so it overrides, not replaces, the main application.properties. See ../decisions.md.
spring.datasource.url=jdbc:h2:mem:itinerarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
