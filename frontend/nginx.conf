server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve via Docker DNS so a redeployed backend (new IP) or late start doesn't break nginx.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Backend routes all start with /api; "backend" is the compose service name.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (react-router) fall back to index.html on refresh.
    location / {
        try_files $uri /index.html;
    }
}
