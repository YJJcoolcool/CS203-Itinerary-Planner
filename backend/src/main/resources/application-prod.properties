# Prod: Postgres reachable as host "db". DB_PASSWORD must be set in the environment.
spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Proactive rain polling is part of the product in production. The base config
# keeps it off for dev/tests; set APP_POLLING_ENABLED=false to disable it here.
app.polling.enabled=${APP_POLLING_ENABLED:true}
