spring.application.name=itinerary-planner

# Local Clerk configuration
spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# H2 Database
spring.datasource.url=jdbc:h2:mem:itinerarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI
spring.ai.openai.api-key=demo-placeholder-key

# OSM integration
app.osm.user-agent=${APP_OSM_USER_AGENT:ItineraryPlanner/1.0 (+https://github.com/CS203-Itinerary-Planner)}
app.osm.nominatim.base-url=${APP_OSM_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.osm.overpass.base-url=${APP_OSM_OVERPASS_BASE_URL:https://overpass-api.de/api/interpreter}
app.osm.connect-timeout=${APP_OSM_CONNECT_TIMEOUT:5s}
app.osm.read-timeout=${APP_OSM_READ_TIMEOUT:30s}

# Clerk user ids (comma-separated) promoted to ADMIN on login. Empty = nobody.
app.admin.clerk-user-ids=${ADMIN_CLERK_USER_IDS:}