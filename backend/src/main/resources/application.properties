spring.application.name=itinerary-planner

# Local Clerk configuration
spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# H2 Database
spring.datasource.url=jdbc:h2:mem:itinerarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI
spring.ai.openai.api-key=demo-placeholder-key
